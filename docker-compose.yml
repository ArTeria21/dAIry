services:
  dairy-bot:
    build: .
    image: dairy-bot:latest
    user: "1000:1000"
    env_file:
      - .env
    environment:
      HOME: /tmp
      JOURNAL_DIR: /data
      GIT_AUTHOR_NAME: dairy-bot
      GIT_AUTHOR_EMAIL: dairy-bot@local
      GIT_COMMITTER_NAME: dairy-bot
      GIT_COMMITTER_EMAIL: dairy-bot@local
      GIT_SSH_COMMAND: "ssh -i /tmp/runtime_ssh/github_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/runtime_ssh/known_hosts"
      EDIT_API_TOKEN: ${EDIT_API_TOKEN:-}
      EDIT_API_HOST: 0.0.0.0
      EDIT_API_PORT: 8081
      REVIEWS_ENABLED: "${REVIEWS_ENABLED:-false}"
      EMBEDDINGS_DB_PATH: /app/data/embeddings.sqlite3
      REVIEWS_DB_PATH: /app/data/reviews.sqlite3
      REVIEW_ASSETS_DIR: /app/data/review_images
      REVIEW_MODEL_NAME: ${REVIEW_MODEL_NAME:-openai/gpt-5.6-terra}
      REVIEW_IMAGE_MODEL_NAME: ${REVIEW_IMAGE_MODEL_NAME:?Set REVIEW_IMAGE_MODEL_NAME in .env}
      REVIEW_IMAGE_FALLBACK_MODEL_NAME: ${REVIEW_IMAGE_FALLBACK_MODEL_NAME:?Set REVIEW_IMAGE_FALLBACK_MODEL_NAME in .env}
      REVIEW_MAX_SEARCH_CALLS: "${REVIEW_MAX_SEARCH_CALLS:-6}"
      REVIEW_WEEKLY_SEND_TIME: "${REVIEW_WEEKLY_SEND_TIME:-09:00}"
      REVIEW_MONTHLY_SEND_TIME: "${REVIEW_MONTHLY_SEND_TIME:-10:00}"
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
    volumes:
      - ./data:/app/data
      - ${HOST_JOURNAL_DIR:-/path/to/obsidian/repo}:/data
      - ${SSH_KEY_PATH:-${HOME}/.ssh/github_ed25519}:/tmp/ssh/github_ed25519:ro
      - ${HOME}/.ssh/known_hosts:/tmp/ssh/known_hosts:ro
    command:
      - /bin/sh
      - -lc
      - |
        test -f /tmp/ssh/github_ed25519 || {
          echo "SSH private key is not a file. Set SSH_KEY_PATH to your real private key file." >&2
          exit 1
        }
        mkdir -p /tmp/runtime_ssh
        cp /tmp/ssh/github_ed25519 /tmp/runtime_ssh/github_ed25519
        cp /tmp/ssh/known_hosts /tmp/runtime_ssh/known_hosts
        chmod 700 /tmp/runtime_ssh
        chmod 600 /tmp/runtime_ssh/github_ed25519 /tmp/runtime_ssh/known_hosts
        exec /app/.venv/bin/python src/bot.py
    init: true
    restart: unless-stopped
    networks:
      - layer3
    expose:
      - "8081"

  layer3-backend:
    build:
      context: ./web/backend
    image: dairy-layer3-backend:latest
    env_file:
      - .env
    environment:
      ENRICHMENT_DB_PATH: /bot-data/enrichment.sqlite3
      EMBEDDINGS_DB_PATH: /bot-data/embeddings.sqlite3
      VAULT_DIR: /vault
      ANALYSIS_CACHE_PATH: /app/cache/analysis_cache.sqlite3
      REVIEWS_DB_PATH: /bot-data/reviews.sqlite3
      REVIEW_ASSETS_DIR: /bot-data/review_images
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
      WEB_LOGIN_RATE_LIMIT_ATTEMPTS: ${WEB_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      WEB_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${WEB_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      BOT_EDIT_API_URL: http://dairy-bot:8081
      EDIT_API_TOKEN: ${EDIT_API_TOKEN:-}
    volumes:
      - ./data:/bot-data:ro
      - ${HOST_JOURNAL_DIR:-/path/to/obsidian/repo}:/vault:ro
      - layer3-analysis-cache:/app/cache
    networks:
      - layer3
    expose:
      - "8000"
    init: true
    restart: unless-stopped

  layer3-frontend:
    build:
      context: ./web/frontend
    image: dairy-layer3-frontend:latest
    depends_on:
      - layer3-backend
    ports:
      - "${LAYER3_FRONTEND_BIND:-127.0.0.1}:${LAYER3_FRONTEND_PORT:-18080}:80"
    networks:
      - layer3
    init: true
    restart: unless-stopped

volumes:
  layer3-analysis-cache:

networks:
  layer3:
    name: dairy-layer3
