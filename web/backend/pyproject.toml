[project]
name = "dairy-layer3-backend"
version = "0.1.0"
description = "Read-only analytics API for the dAIry enriched journal."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.116.0",
    "hdbscan>=0.8.40",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "numpy>=2.3.0",
    "openai>=1.52.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.5.2",
    "umap-learn>=0.5.9.post2",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dairy_web"]
