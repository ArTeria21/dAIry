[project]
name = "dAIry"
version = "0.1.0"
description = "Single-user Telegram journal bot (text + voice) for Obsidian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "aiofiles>=23.2.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.116.0",
    "gitpython>=3.1.43",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "numpy>=2.3.0",
    "openai>=1.52.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.5.2",
    "pyyaml>=6.0.1",
    "tqdm>=4.67.1",
    "tzdata>=2024.1",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dairy_bot"]
